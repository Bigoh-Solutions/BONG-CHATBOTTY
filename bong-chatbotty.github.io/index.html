<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BONG CHATTER</title>
    <!-- Connects your decoupled visual styling layers -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    
    <div class="admin-badge">
        <div class="status-dot"></div>
        <div class="admin-name">DHUBU / BIGOHSOLUTIONS (SOLE COMMAND)</div>
    </div>

    <h1>AI BONG CHATTER PLATFORM</h1>

    <div class="console-box">
        <div class="input-group">
            <input type="text" id="queryInput" class="search-box" placeholder="Feed data parameter to Diver...">
            <button id="launchBtn" class="action-btn">LAUNCH</button>
            <button id="downloadBtn" class="action-btn download-style">DOWNLOAD CONFIG</button>
        </div>

        <div class="response-terminal">
            <div class="term-header">
                <span>📟 SYSTEM_EVALUATION_STREAM.LOG</span>
                <span id="status-tag" style="color: #20c20e;">[READY]</span>
            </div>
            <div id="output-panel">Awaiting target parameters...</div>
        </div>
    </div>

    <!-- Integrates your clean dictionary execution logic assets -->
    <script src="script.js"></script>
</body>
</html>
